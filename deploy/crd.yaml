apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentpolicies.agents.sandbox.io
spec:
  group: agents.sandbox.io
  names:
    kind: AgentPolicy
    listKind: AgentPolicyList
    plural: agentpolicies
    singular: agentpolicy
    shortNames:
      - agpol
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: ["agentTypes", "defaultAction"]
              properties:
                agentTypes:
                  type: array
                  items:
                    type: string
                defaultAction:
                  type: string
                  enum: ["allow", "deny"]
                mode:
                  type: string
                  enum: ["enforcing", "permissive"]
                toolPermissions:
                  type: array
                  items:
                    type: object
                    required: ["tool", "action"]
                    properties:
                      tool:
                        type: string
                      action:
                        type: string
                        enum: ["allow", "deny"]
                      constraints:
                        type: object
                        properties:
                          pathPatterns:
                            type: array
                            items:
                              type: string
                          allowedDomains:
                            type: array
                            items:
                              type: string
                          deniedDomains:
                            type: array
                            items:
                              type: string
                          allowedPorts:
                            type: array
                            items:
                              type: integer
                              format: int32
                          maxSizeBytes:
                            type: integer
                            format: int64
                          timeout:
                            type: string
                tenantIsolation:
                  type: object
                  required: ["mtsLabel"]
                  properties:
                    mtsLabel:
                      type: string
                    enforceMode:
                      type: string
            status:
              type: object
              properties:
                compiledHash:
                  type: string
                lastUpdated:
                  type: string
                  format: date-time
                activeBindings:
                  type: integer
                  format: int32
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
      additionalPrinterColumns:
        - name: Agents
          type: string
          jsonPath: .spec.agentTypes[0]
        - name: Default
          type: string
          jsonPath: .spec.defaultAction
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
